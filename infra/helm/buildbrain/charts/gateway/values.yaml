image:
  repository: buildbrain/gateway
  tag: latest
port: 4000
replicaCount: 1

# Environment variables exposed to the container via ConfigMap and Secret
env:
  config:
    MONGO_URL: mongodb://mongo:27017
    REDIS_URL: redis://redis:6379
    AI_SERVICE_URL: http://ai-service:8000
  secret:
    STRIPE_SECRET_KEY: ""
    STRIPE_WEBHOOK_SECRET: ""

resources:
  requests:
    cpu: "100m"
    memory: "128Mi"
  limits:
    cpu: "500m"
    memory: "512Mi"
