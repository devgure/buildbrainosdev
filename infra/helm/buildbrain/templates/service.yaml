{{- range $name, $svc := .Values.services -}}
{{- if $svc.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    app: {{ $name }}
spec:
  type: ClusterIP
  ports:
  - port: {{ $svc.port }}
    targetPort: {{ $svc.port }}
    protocol: TCP
    name: http
  selector:
    app: {{ $name }}
---
{{- end }}
{{- end }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "buildbrain.fullname" . }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.port }}
  selector:
    app: {{ include "buildbrain.name" . }}
