apiVersion: apps/v1
kind: Deployment
metadata:
  name: blueprint-agent
  labels:
    app: blueprint-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: blueprint-agent
  template:
    metadata:
      labels:
        app: blueprint-agent
    spec:
      containers:
        - name: blueprint-agent
          image: buildbrain/blueprint-agent:latest
          ports:
            - containerPort: 8100
          envFrom:
            - secretRef:
                name: blueprint-secrets
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000

---
apiVersion: v1
kind: Service
metadata:
  name: blueprint-agent
spec:
  selector:
    app: blueprint-agent
  ports:
    - protocol: TCP
      port: 8100
      targetPort: 8100
  type: ClusterIP
