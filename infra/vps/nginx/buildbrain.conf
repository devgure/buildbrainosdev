server {
    listen 80;
    server_name buildbrain.example.com; # replace with your domain

    # Redirect all HTTP to HTTPS (Certbot will create the TLS block)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# TLS server block (example; certbot will populate the certs)
server {
    listen 443 ssl;
    server_name buildbrain.example.com; # replace with your domain

    ssl_certificate /etc/letsencrypt/live/buildbrain.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/buildbrain.example.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Proxy to local gateway
    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }
}
