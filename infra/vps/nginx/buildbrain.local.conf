# Nginx configuration for BuildBrain local Ubuntu server (reverse proxy to gateway)
# Place this at /etc/nginx/sites-available/buildbrain.local and symlink to sites-enabled

server {
  listen 80;
  server_name buildbrain.local;

  # increase allowable body size for blueprint uploads
  client_max_body_size 100M;

  location / {
    proxy_pass http://127.0.0.1:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
  }

  # health endpoints for Kubernetes / monitoring
  location /healthz {
    proxy_pass http://127.0.0.1:4000/live;
  }

  location /readyz {
    proxy_pass http://127.0.0.1:4000/ready;
  }

  access_log /var/log/nginx/buildbrain.access.log;
  error_log /var/log/nginx/buildbrain.error.log;
}
